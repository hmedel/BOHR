<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Química BOHR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .chat-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9ff;
        }
        
        .message {
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        
        .message.assistant {
            background: white;
            border: 2px solid #e5e7eb;
        }
        
        .message .label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        .message.user .label {
            color: rgba(255,255,255,0.9);
        }
        
        .message.assistant .label {
            color: #667eea;
        }
        
        .source-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 8px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }
        
        #queryInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #queryInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            max-width: 80px;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Asistente de Química BOHR</h1>
            <p>Pregúntame sobre estructura atómica, enlaces químicos y más</p>
        </header>
        
        <div class="chat-card">
            <div class="messages" id="messages">
                <div class="message assistant">
                    <div class="label">🤖 Asistente</div>
                    <div>¡Hola! Soy tu asistente de química. Tengo acceso a varios libros sobre estructura atómica, enlaces químicos y mecánica cuántica. ¿En qué puedo ayudarte?</div>
                </div>
            </div>
            
            <div class="input-area">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="Escribe tu pregunta aquí..."
                    onkeypress="if(event.key==='Enter') sendQuery()"
                    autofocus
                >
                <button class="btn" onclick="sendQuery()" id="sendBtn">
                    Enviar
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Detectar automáticamente la URL del servidor
        const API_URL = `${window.location.protocol}//${window.location.hostname}:8000`;
        
        console.log('API URL:', API_URL);
        
        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            
            if (!query) return;
            
            addMessage(query, 'user');
            input.value = '';
            
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';
            input.disabled = true;
            
            const typingIndicator = addTypingIndicator();
            
            try {
                console.log('Sending query to:', `${API_URL}/query`);
                
                const response = await fetch(`${API_URL}/query`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: 1,
                        max_context: 500
                    })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                typingIndicator.remove();
                addMessage(data.answer, 'assistant', data.sources);
                
            } catch (error) {
                console.error('Error completo:', error);
                typingIndicator.remove();
                addMessage(`❌ Error: ${error.message}. Por favor, revisa la consola (F12) para más detalles.`, 'assistant');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Enviar';
                input.disabled = false;
                input.focus();
            }
        }
        
        function addMessage(text, type, sources = []) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = type === 'user' ? '👤 Tú' : '🤖 Asistente';
            let html = `<div class="label">${label}</div><div>${text}</div>`;
            
            if (sources && sources.length > 0) {
                html += '<div>' + sources.map(s => 
                    `<span class="source-tag">📄 ${s}</span>`
                ).join(' ') + '</div>';
            }
            
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator active';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            messagesDiv.appendChild(indicator);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return indicator;
        }
        
        // Test de conectividad al cargar
        fetch(`${API_URL}/health`)
            .then(r => r.json())
            .then(data => console.log('✅ Backend conectado:', data))
            .catch(e => console.error('❌ No se puede conectar al backend:', e));
    </script>
</body>
</html>
